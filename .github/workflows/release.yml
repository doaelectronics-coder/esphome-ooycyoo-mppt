name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome==2026.8.2
      - name: Build bundle
        run: scripts/make_bundle.sh "ooycyoo-mppt-bundle-${GITHUB_REF_NAME}.tar.gz"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ooycyoo-mppt-bundle-${GITHUB_REF_NAME}.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
